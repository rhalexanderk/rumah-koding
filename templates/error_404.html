{% extends "base.html" %}

{% block title %}Halaman Tidak Ditemukan - Rumah Koding{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center p-6 text-center min-h-[calc(100vh-5rem)] relative">
    
    <!-- Latar Belakang Cahaya Subtil -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/5 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <div class="text-[140px] md:text-[180px] font-extrabold leading-none tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-blue-400 to-cyan-300 drop-shadow-2xl">
        404
    </div>
    
    <h2 class="text-2xl md:text-3xl font-bold text-white mt-4 mb-4">
        Oops! Halaman Tidak Ditemukan
    </h2>
    
    <p class="text-slate-400 text-sm md:text-base max-w-md mx-auto mb-10 leading-relaxed">
        Alamat yang kamu tuju mungkin sudah dihapus, dipindahkan, atau kamu salah mengetikkan tautan URL.
    </p>
    
    <a href="/" class="inline-flex items-center justify-center gap-2 px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/25 transition-all transform hover:-translate-y-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Kembali ke Beranda
    </a>
</div>
{% endblock %}
