<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Latihan Otomasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700/60 rounded-2xl p-6 shadow-2xl">
        <div class="mb-4">
            <span class="px-2.5 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-[10px] font-bold uppercase tracking-wider rounded-md">
                Target Iframe Lokal
            </span>
            <h3 class="text-lg font-bold mt-2 text-white">Formulir Simulasi Login</h3>
            <p class="text-xs text-slate-400">Gunakan skrip Playwright untuk mengisi form ini secara otomatis.</p>
        </div>

        <form id="sandbox-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                <input type="text" id="username-input" placeholder="Ketik admin..." 
                       class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500 transition-all">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" id="password-input" placeholder="Ketik 12345..." 
                       class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500 transition-all">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm rounded-xl transition-all shadow-lg shadow-blue-500/20">
                Masuk Sistem
            </button>
        </form>

        <!-- Elemen Target Sukses yang akan diverifikasi oleh Playwright -->
        <div id="welcome-message" class="mt-4 p-3.5 rounded-xl text-xs font-bold hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-center animate-pulse">
            🎉 Selamat! Login Berhasil & Terverifikasi.
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username-input').value;
            const pass = document.getElementById('password-input').value;
            const msg = document.getElementById('welcome-message');
            
            // 🛠️ PERUBAHAN: Menerima input apa saja asalkan tidak kosong
            if (user.trim() !== '' && pass.trim() !== '') {
                msg.classList.remove('hidden');
            } else {
                alert('Kolom username dan password wajib diisi!');
            }
        }
    </script>
</body>
</html>
